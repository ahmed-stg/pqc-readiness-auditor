[project]
name = "pqc-readiness-auditor"
version = "0.2.0"
description = "Scan certificates, TLS/SSH endpoints, PCAP captures, and source code for classically weak and quantum-vulnerable cryptography. Assess exposure with Mosca's Theorem, map compliance against NIST IR 8547 and CNSA 2.0, and export a CycloneDX 1.6 Cryptographic Bill of Materials."
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Security Engineers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Build Tools",
]
keywords = ["pqc", "post-quantum", "cryptography", "tls", "ssh", "cbom", "cyclonedx", "nist", "cnsa2"]
authors = [
    {name = "Ahmed Kaouadji", email = "a.kaouadji@esi-sba.dz"},
]

dependencies = [
    "cryptography>=41.0.0",
    "paramiko>=3.0.0",
    "scapy>=2.5.0",
    "pyopenssl>=23.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pqc_auditor*"]

[project.scripts]
pqc-auditor = "pqc_auditor.cli:main"
